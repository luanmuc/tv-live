name: refresh-sources

on:
  schedule:
    # 每天 UTC 19:00 = 北京时间 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 源脚本单测
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: 发现新源
        run: timeout 300 python3 scripts/crawl_sources.py || true

      - name: 同步国际源
        run: timeout 420 python3 scripts/refresh_sources.py || true

      - name: 合并央视卫视多线路源
        run: timeout 1800 python3 scripts/build_pack.py

      - name: 健康检查
        run: python3 scripts/refresh_sources.py --check

      - name: 签名源清单
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，无法签名源清单"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          python3 scripts/sign_sources.py \
            --keystore "$PWD/keystore.jks" \
            --store-password "$KEYSTORE_PASSWORD" \
            --key-alias "$KEY_ALIAS" \
            --key-password "$KEY_PASSWORD"
          rm -f keystore.jks

      - name: 同步到国内对象存储（可选）
        if: ${{ vars.SOURCES_DOMESTIC_BASE_URL != '' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          python3 -m pip install --quiet oss2 cos-python-sdk-v5
          python3 scripts/upload_domestic.py

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/discovered.json sources/dist core/data/src/main/assets/sources
          if git diff --cached --quiet; then
            echo "源无变化"
          else
            git commit -m "chore(sources): 每日同步直播源 [skip ci]"
            git pull --rebase origin main
            git push
          fi
