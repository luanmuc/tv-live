name: refresh-sources

on:
  schedule:
    # 每天 UTC 19:00 = 北京时间 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 同步国际源
        run: python3 scripts/refresh_sources.py

      - name: 合并央视卫视多线路源
        run: python3 scripts/build_pack.py

      - name: 健康检查
        run: python3 scripts/refresh_sources.py --check

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/dist core/data/src/main/assets/sources
          if git diff --cached --quiet; then
            echo "源无变化"
          else
            git commit -m "chore(sources): 每日同步直播源 [skip ci]"
            git push
          fi
