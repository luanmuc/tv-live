name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装 platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 内置源健康检查
        run: python3 scripts/refresh_sources.py --check

      - name: 构建 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            export KEYSTORE="$PWD/keystore.jks"
            ./gradlew :tv:assembleOriginalRelease --no-daemon --stacktrace
          else
            echo "未配置签名密钥，构建 debug 包"
            ./gradlew :tv:assembleOriginalDebug --no-daemon --stacktrace
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' tv/build.gradle.kts | head -1)
          APK=$(find tv/build/outputs/apk -name "*.apk" | head -1)
          cp -v "$APK" "out/doubao-tv-${VERSION}.apk"
          ls -lh out

      # Actions 产物有 500MB 配额，改为发到 Release（不占配额，且有固定直链）
      - name: 发布到 latest Release
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新构建" --notes "每次 push 到 main 自动更新（非正式版）" --prerelease --latest=false
          gh release upload latest out/*.apk --clobber

      - name: 发布到版本 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
