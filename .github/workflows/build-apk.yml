name: build-apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 同一时间只跑一个构建，新的覆盖旧的
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-36-cmdline11076708-v1

      - name: Android SDK
        run: |
          if [ -x "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDK 缓存命中，跳过下载"
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
            echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装 platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 内置源健康检查
        run: python3 scripts/refresh_sources.py --check

      # 只出正式版：签名密钥缺失直接失败，不再回退 debug 包
      - name: 校验签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，无法构建正式版"
            exit 1
          fi

      - name: 构建正式版 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          export KEYSTORE="$PWD/keystore.jks"
          ./gradlew :tv:assembleOriginalRelease --no-daemon --build-cache --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' tv/build.gradle.kts | head -1)
          APK=$(find tv/build/outputs/apk -name "*.apk" | head -1)
          cp -v "$APK" "out/doubao-tv-${VERSION}.apk"
          ls -lh out

      - name: 留档构建产物
        uses: actions/upload-artifact@v4
        with:
          name: doubao-tv-release
          path: out/*.apk
          retention-days: 7
      - name: 发布正式版（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
