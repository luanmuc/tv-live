name: line-audit

on:
  schedule:
    # 每天 04:30（北京时间）巡检一次，避开 03:00 的全量采集
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-writes
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 巡检最终线路
        run: python3 scripts/crawl_check.py

      - name: 提交巡检结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/dist/line-audit.json
          if git diff --cached --quiet; then
            echo "巡检结果无变化"
          else
            git commit -m "chore(sources): 线路巡检 [skip ci]"
            git pull --rebase origin main
            git push
          fi
